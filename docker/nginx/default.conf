# Map connection upgrade cho WebSocket (Socket.io & Grafana Live)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ─────────────────────────────────────────────────────────────
# HTTP api.lawoh.io.vn -> NestJS Backend
# ─────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name api.lawoh.io.vn api.lawoh.click;

    # Let's Encrypt ACME Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Docker internal DNS resolver
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://lawoh-container:3300;

    client_max_body_size 50M;

    # REST API + Swagger + Prometheus metrics
    location / {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 75s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
    }

    # WebSocket (Socket.io)
    location /socket.io/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

# ─────────────────────────────────────────────────────────────
# HTTP grafana.lawoh.io.vn -> Grafana Dashboard
# ─────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name grafana.lawoh.io.vn grafana.lawoh.click;

    # Let's Encrypt ACME Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Docker internal DNS resolver
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $grafana_upstream http://grafana:3000;

    # Grafana UI + API
    location / {
        proxy_pass         $grafana_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Grafana Live WebSocket
    location /api/live/ {
        proxy_pass         $grafana_upstream/api/live/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
