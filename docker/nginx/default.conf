# Map connection upgrade cho WebSocket (Socket.io)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 1. HTTP (Port 80) -> Dành cho Certbot xác thực SSL & Redirect sang HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.lawoh.click;

    # Endpoint để Certbot lấy/gia hạn chứng chỉ SSL Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect tất cả traffic còn lại sang HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS (Port 443) -> Reverse Proxy tới Backend NestJS
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.lawoh.click;

    # Docker internal DNS resolver giúp Nginx không bị crash khi Backend khởi động sau
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://lawoh-container:3300;

    # Đường dẫn SSL Certs (Let's Encrypt Certbot)
    ssl_certificate /etc/letsencrypt/live/api.lawoh.click/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.lawoh.click/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Dung lượng tối đa cho file upload (ảnh, avatar, tài liệu)
    client_max_body_size 50M;

    # 2.1. REST API, Swagger UI (/Swagger), Prometheus Metrics (/metrics)
    location / {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 75s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 2.2. WebSocket (Socket.io)
    location /socket.io/ {
        proxy_pass $backend_upstream/socket.io/;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keepalive thời gian dài cho WebSocket connection
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 2.3. Grafana Monitoring Dashboard (HTTPS An toàn)
    location = /grafana {
        return 301 https://$host/grafana/;
    }

    location /grafana/ {
        proxy_pass http://law_grafana:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

