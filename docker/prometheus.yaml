global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100'] # hoặc 'law_loki:3100'
  - job_name: 'promtail'
    static_configs:
      - targets: ['promtail:9080'] # hoặc 'law_promtail:9080'
  - job_name: 'law-ohbe-app'
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ['host.docker.internal:3300']
        labels:
          app: 'law-ohbe'
          env: 'development'
